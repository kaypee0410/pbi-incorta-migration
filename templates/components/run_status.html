<section class="run" id="run" aria-live="polite" hidden>
  <p class="run-title" id="run-title"></p>
  <div class="run-summary" id="run-summary" hidden>
    <span class="dot ok" aria-hidden="true"></span>
    <span id="run-summary-text"></span>
    <button type="button" class="linkbtn" id="steps-toggle" aria-expanded="false" aria-controls="steps">Show steps</button>
  </div>
  <ol class="steps" id="steps" hidden></ol>
</section>
