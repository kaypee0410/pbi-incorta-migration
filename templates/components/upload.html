<form class="panel" id="upload-form" aria-labelledby="upload-h" novalidate>
  <h2 id="upload-h" class="sr-only">Upload a file</h2>

  <label class="drop" id="drop" for="file">
    <svg width="40" height="48" viewBox="0 0 40 48" aria-hidden="true"><rect class="sheet" x="1" y="1" width="38" height="46" rx="2" stroke-width="1.5"/><rect class="bar" x="8" y="22" width="5" height="16"/><rect class="bar" x="17.5" y="14" width="5" height="24" opacity=".7"/><rect class="bar" x="27" y="28" width="5" height="10" opacity=".45"/></svg>
    <span>
      <span class="drop-name" id="file-name">Drop a .pbix file here</span><br>
      <span class="drop-hint" id="file-hint">Or click to browse. Also reads .pbit templates and .bim models, up to {{ max_mb }} MB.</span>
    </span>
    <input class="sr-only" type="file" id="file" name="file" accept="{{ extensions }}">
  </label>

  <div class="opts">
    <div class="fixed">
      <strong>Writes Spark SQL for Incorta</strong>
      <span class="help help-block">Every MV, formula and insight query is translated to Spark SQL, the language Incorta MVs run.</span>
    </div>

    <div>
      <label class="check"><input type="checkbox" checked id="opt-data" name="read_data">
        <span><strong>Read the data saved in the file</strong>
        <span class="help help-block">Profiles each column and test-runs every insight query. Slower on large files.</span></span>
      </label>
    </div>

    <div>
      <label class="check"><input type="checkbox" checked id="opt-package" name="incorta">
        <span><strong>Build the Incorta package</strong>
        <span class="help help-block">SQL for each table and MV, a design PDF, a lineage diagram and the build-plan sheets, zipped.</span></span>
      </label>
    </div>
  </div>

  <div class="actions">
    <button type="submit" class="btn btn-primary" id="run-btn" disabled>Create workbook</button>
    <p class="form-error" id="form-error" role="alert" hidden></p>
  </div>
</form>
